    <path d="M540 700 L540 345" stroke-width="4"/>
    <path d="M486 714 L340 390" stroke-width="3"/>
    <path d="M594 714 L740 390" stroke-width="3"/>
    <path d="M445 745 L185 520" stroke-width="2"/>

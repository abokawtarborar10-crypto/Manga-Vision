    <path d="M540 1000 C486 938 398 904 258 896 L211 1266 C363 1255 474 1273 540 1336" stroke-width="10"/>
    <path d="M540 1000 C594 938 682 904 822 896 L869 1266 C717 1255 606 1273 540 1336" stroke-width="10"/>
    <path d="M540 1000 C535 1090 536 1219 540 1336" stroke-width="8"/>

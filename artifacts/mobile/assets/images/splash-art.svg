    <path d="M217 1262 C372 1250 477 1270 540 1334 C603 1270 708 1250 863 1262" stroke-width="30"/>
  </g>

  <!-- wordmark -->
  <g text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">
    <text x="540" y="1518" fill="#f4f5f6" font-size="66" font-weight="700" letter-spacing="7">MANGA<tspan fill="#ff3144">VERSE</tspan></text>
    <rect x="435" y="1551" width="210" height="3" rx="2" fill="#ff3144" opacity=".82"/>
    <text x="540" y="1592" fill="#aeb4bd" font-size="20" letter-spacing="5">DIVE INTO WORLDS UNTOLD</text>

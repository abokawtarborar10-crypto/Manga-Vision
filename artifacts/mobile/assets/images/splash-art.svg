<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#171a1f"/>
      <stop offset="58%" stop-color="#0d1014"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>
    <linearGradient id="red" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff5d68"/>
      <stop offset="48%" stop-color="#ff2639"/>
      <stop offset="100%" stop-color="#ad0d24"/>
    </linearGradient>
    <linearGradient id="redSoft" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff3a4b" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ff172e" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#343a42"/>
      <stop offset="100%" stop-color="#171a20"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="leftPage"><path d="M540 962 C495 913 414 884 268 874 L225 1268 C370 1258 475 1280 540 1332 Z"/></clipPath>
    <clipPath id="rightPage"><path d="M540 962 C585 913 666 884 812 874 L855 1268 C710 1258 605 1280 540 1332 Z"/></clipPath>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- subdued floating manga panels -->
